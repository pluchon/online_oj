# 启动所需的最小配置，其余配置从 Nacos 导入
spring:
  application:
    # 应用名称
    name: oj-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      # 地址、命名空间与账号取自 OJ_ 前缀的环境变量（避免与其他项目的 NACOS_* 冲突），默认值对应本地 docker 环境
      server-addr: ${OJ_NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${OJ_NACOS_USERNAME:}
      password: ${OJ_NACOS_PASSWORD:}
      discovery:
        namespace: ${OJ_NACOS_NAMESPACE:8f599ee1-85ee-45b3-8435-1522e90fb2e0}
      config:
        namespace: ${OJ_NACOS_NAMESPACE:8f599ee1-85ee-45b3-8435-1522e90fb2e0}
        file-extension: yaml
  config:
    # 后导入的覆盖先导入的；Nacos 连不上时启动失败，Data ID 不存在时只告警
    import:
      - nacos:${spring.application.name}-${spring.profiles.active}.yaml?group=DEFAULT_GROUP
