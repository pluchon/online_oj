name: oj_online

services:
  mysql:
    image: mysql:8.4
    container_name: oj-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: bitoj_dev
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - oj_mysql_data:/var/lib/mysql
      # 首次创建数据卷时按文件名顺序执行：业务库与 XXL-JOB 库，再是 Nacos 配置库
      - ./db_sql/oj_init.sql:/docker-entrypoint-initdb.d/01_oj_init.sql:ro
      - ./nacos/nacos_v3_init.sql:/docker-entrypoint-initdb.d/02_nacos_v3_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456789}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - oj-net

  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: oj-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
      # 3.x 控制台独立端口；宿主机 8080 常被 Windows 保留，改用 18848
      - "18848:8080"
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      # 客户端鉴权保持关闭（与 2.x 时一致）；控制台登录鉴权由 3.x 默认开启
      NACOS_AUTH_ENABLE: "false"
      # 令牌密钥与服务端身份标识，取自 deploy/.env（参考 .env.example）
      NACOS_AUTH_TOKEN: ${OJ_NACOS_AUTH_TOKEN:?请在 deploy/.env 中设置 OJ_NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${OJ_NACOS_AUTH_IDENTITY_KEY:?请在 deploy/.env 中设置 OJ_NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${OJ_NACOS_AUTH_IDENTITY_VALUE:?请在 deploy/.env 中设置 OJ_NACOS_AUTH_IDENTITY_VALUE}
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: bitoj_nacos_v3
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    volumes:
      - oj_nacos_data:/home/nacos/data
      - oj_nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oj-net

  redis:
    image: redis:latest
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - oj_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - oj-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: oj-xxl-job-admin
    restart: unless-stopped
    ports:
      # Windows 常把 8080 列入系统保留端口，宿主机改用 18080
      - "18080:8080"
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456789}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oj-net

  elasticsearch:
    image: elasticsearch:8.18.8
    container_name: oj-es-dev
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      discovery.type: single-node
      xpack.security.enabled: "false"
    privileged: true
    volumes:
      - oj_es_data:/usr/share/elasticsearch/data
      - ./dev/elasticSearch/es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - oj-net

  kibana:
    image: kibana:8.18.8
    container_name: oj-kibana-dev
    restart: unless-stopped
    ports:
      - "15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://oj-es-dev:9200"
      I18N_LOCALE: "zh-CN"
    volumes:
      - ./dev/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      - elasticsearch
    networks:
      - oj-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oj-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    volumes:
      - oj_rabbitmq_data:/var/lib/rabbitmq
    networks:
      oj-net:
        aliases:
          - rabbitmq
          - oj-rabbitmq

  zipkin:
    image: openzipkin/zipkin:3
    container_name: oj-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      # 内存存储，重启后清空；只用于本地排查调用链
      STORAGE_TYPE: mem
      JAVA_OPTS: "-Xms128m -Xmx256m"
    networks:
      - oj-net

networks:
  oj-net:
    driver: bridge

volumes:
  oj_mysql_data:
  oj_nacos_data:
  oj_nacos_logs:
  oj_redis_data:
  oj_es_data:
  oj_rabbitmq_data:
