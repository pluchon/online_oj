name: oj_online

services:
  mysql:
    image: mysql:8.4
    container_name: oj-mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: bitoj_dev
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - oj_mysql_data:/var/lib/mysql
      - ./db_sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456789}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - oj-net

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: oj-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: bitoj_nacos_local
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    volumes:
      - oj_nacos_data:/home/nacos/data
      - oj_nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oj-net

  redis:
    image: redis:latest
    container_name: oj-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - oj_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - oj-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: oj-xxl-job-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-123456789}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oj-net

  elasticsearch:
    image: elasticsearch:8.5.3
    container_name: oj-es-dev
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      discovery.type: single-node
      xpack.security.enabled: "false"
    privileged: true
    volumes:
      - oj_es_data:/usr/share/elasticsearch/data
      - ./dev/elasticSearch/es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - oj-net

  kibana:
    image: kibana:8.5.3
    container_name: oj-kibana-dev
    restart: unless-stopped
    ports:
      - "15601:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://oj-es-dev:9200"
      I18N_LOCALE: "zh-CN"
    volumes:
      - ./dev/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      - elasticsearch
    networks:
      - oj-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oj-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: "123456"
    volumes:
      - oj_rabbitmq_data:/var/lib/rabbitmq
    networks:
      oj-net:
        aliases:
          - rabbitmq
          - oj-rabbitmq

networks:
  oj-net:
    driver: bridge

volumes:
  oj_mysql_data:
  oj_nacos_data:
  oj_nacos_logs:
  oj_redis_data:
  oj_es_data:
  oj_rabbitmq_data:
