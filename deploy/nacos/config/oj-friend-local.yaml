# Data ID: oj-friend-local.yaml  Group: DEFAULT_GROUP  格式: YAML
# 密钥一律引用 OJ_ 前缀的环境变量，不要把真实值提交到仓库
server:
  port: 9202

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/bitoj_dev?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8
    username: ${OJ_MYSQL_USERNAME:root}
    password: ${OJ_MYSQL_PASSWORD:123456789}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${OJ_REDIS_PASSWORD:123456}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${OJ_RABBITMQ_USERNAME:admin}
    password: ${OJ_RABBITMQ_PASSWORD:123456}
    virtual-host: /
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

jwt:
  secret: ${OJ_JWT_SECRET}

elasticsearch:
  uris: http://localhost:9200
  connectTimeout: 1000
  socketTimeout: 30000
  connectionRequestTimeout: 500
  maxConnTotal: 100

# 头像上传（阿里云 OSS）
oss:
  endpoint: https://oss-cn-shenzhen.aliyuncs.com
  access-key-id: ${OJ_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OJ_OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OJ_OSS_BUCKET_NAME:}
  url-prefix: ${OJ_OSS_URL_PREFIX:}
  avatar-dir: online_oj/avatar/
