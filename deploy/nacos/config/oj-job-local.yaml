# Data ID: oj-job-local.yaml  Group: DEFAULT_GROUP  格式: YAML
# 密钥一律引用 OJ_ 前缀的环境变量，不要把真实值提交到仓库
server:
  port: 9203

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/bitoj_dev?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8&allowMultiQueries=true
    username: ${OJ_MYSQL_USERNAME:root}
    password: ${OJ_MYSQL_PASSWORD:123456789}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${OJ_REDIS_PASSWORD:123456}

xxl:
  job:
    admin:
      addresses: http://localhost:18080/xxl-job-admin
    # 与 xxl-job-admin 的 accessToken 一致（镜像默认 default_token）
    accessToken: ${OJ_XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: ${spring.application.name}-executor
      port: 9999
      logpath: ./logs/oj_job
