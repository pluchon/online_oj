# Data ID: oj-system-local.yaml  Group: DEFAULT_GROUP  格式: YAML
# 密钥一律引用 OJ_ 前缀的环境变量，不要把真实值提交到仓库
server:
  port: 9201

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/bitoj_dev?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=GMT%2B8
    username: ${OJ_MYSQL_USERNAME:root}
    password: ${OJ_MYSQL_PASSWORD:123456789}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      password: ${OJ_REDIS_PASSWORD:123456}

jwt:
  secret: ${OJ_JWT_SECRET}
