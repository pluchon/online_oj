# Data ID: oj-friend-sentinel-flow.yaml  Group: DEFAULT_GROUP  格式: YAML
# friend 的限流规则。grade 0 = 按并发数限制（同时在途的调用数），1 = 按 QPS；count 为上限
# 同一瞬间涌入的请求可能一起通过（Sentinel 先检查后计数），依次到达时严格生效

# 运行示例 → judge：判题容器池只有 3 个，排队过多时直接返回"判题服务繁忙"
- resource: friend-judge-run
  grade: 0
  count: 10

# AI 辅导流 → oj_ai：同时进行的对话流上限
- resource: friend-ai-tutor
  grade: 0
  count: 20
