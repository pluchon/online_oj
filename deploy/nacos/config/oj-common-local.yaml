# Data ID: oj-common-local.yaml  Group: DEFAULT_GROUP  格式: YAML
# 所有服务最先导入的公共配置，服务自己的 Data ID 可覆盖；密钥一律引用 OJ_ 前缀的环境变量
management:
  tracing:
    sampling:
      # 本地全量采样，生产按需下调
      probability: ${OJ_TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${OJ_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

spring:
  cloud:
    sentinel:
      # 只在 client 包的调用边界定义资源，不统计全部 Web 接口
      filter:
        enabled: false
      # 启动即加载规则，不等第一次调用
      eager: true
      # 规则从 Nacos 读取（未引入 Sentinel 的服务忽略这段）：Data ID 为 {服务名}-sentinel-flow.json / -degrade.json
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace:}
            username: ${spring.cloud.nacos.username:}
            password: ${spring.cloud.nacos.password:}
            group-id: DEFAULT_GROUP
            data-id: ${spring.application.name}-sentinel-flow.json
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr}
            namespace: ${spring.cloud.nacos.config.namespace:}
            username: ${spring.cloud.nacos.username:}
            password: ${spring.cloud.nacos.password:}
            group-id: DEFAULT_GROUP
            data-id: ${spring.application.name}-sentinel-degrade.json
            data-type: json
            rule-type: degrade
  reactor:
    # Reactor 线程（网关、WebClient 回调）自动带上链路上下文
    context-propagation: auto
  rabbitmq:
    # 链路穿过消息队列：发送端写入追踪头，监听端接续
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
